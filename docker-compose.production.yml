version: '3.8'

services:
  ai:
    environment:
      - MODEL_REVISION=${AI_MODEL_REVISION:-d128750597153bb5987e10b1c3493a34e5a4502a}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  mysql:
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    restart: always
    ports: [] # Ensure port is not exposed externally
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  backend:
    environment: &backend_env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_SECURE_COOKIE: "true"
      FORCE_HTTPS: "true"
      LOG_CHANNEL: stderr
      TRUSTED_PROXIES: "*" # Or specific NGINX IP
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    environment: *backend_env
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    environment: *backend_env
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  frontend:
    # Build the static files and serve them using a lightweight server on port 8080
    command: ["sh", "-c", "npm install && npm run build && npx serve -s dist -l 8080"]
    environment:
      - NODE_ENV=production
      - VITE_API_URL=${APP_URL}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  nginx:
    image: nginx:1.24-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
