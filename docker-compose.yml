services:
  ai:
    build: ./ai-service
    volumes:
      - ai_models:/models
    environment:
      MODEL_REVISION: d128750597153bb5987e10b1c3493a34e5a4502a
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 120s
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: internmatchlaravel
      MYSQL_ROOT_PASSWORD: Admin123!
    volumes:
      - internmatch_mysql:/var/lib/mysql
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pAdmin123! --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    working_dir: /var/www/html
    environment: &backend_environment
      APP_NAME: InternMatch
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:8080,http://127.0.0.1:8080
      SANCTUM_STATEFUL_DOMAINS: localhost:8080,127.0.0.1:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: internmatchlaravel
      DB_USERNAME: root
      DB_PASSWORD: Admin123!
      SESSION_DRIVER: file
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      DB_QUEUE_RETRY_AFTER: 150
      AI_ENABLED: "true"
      AI_SERVICE_URL: http://ai:8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sh", "/var/www/html/docker-entrypoint.sh"]

  worker:
    build: ./backend
    restart: unless-stopped
    working_dir: /var/www/html
    environment: *backend_environment
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=100"]

  scheduler:
    build: ./backend
    restart: unless-stopped
    working_dir: /var/www/html
    environment: *backend_environment
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]

  frontend:
    build:
      context: ./frontend
    working_dir: /app
    environment:
      LARAVEL_URL: http://backend:8000
      # Required for Vite HMR file watching to work inside Docker on Windows.
      # Windows NTFS change events don't propagate to the Linux VM, so we poll instead.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "8080"]

volumes:
  ai_models:
  internmatch_mysql:
  backend_vendor:
  frontend_node_modules:


