services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: internmatchlaravel
      MYSQL_USER: internmatch
      MYSQL_PASSWORD: internmatch
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - internmatch_mysql:/var/lib/mysql
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    working_dir: /var/www/html
    environment:
      APP_NAME: InternMatch
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:8080
      SANCTUM_STATEFUL_DOMAINS: localhost:8080,127.0.0.1:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: internmatchlaravel
      DB_USERNAME: internmatch
      DB_PASSWORD: internmatch
      SESSION_DRIVER: file
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    command: ["/usr/local/bin/docker-entrypoint.sh"]

  frontend:
    build:
      context: ./frontend
    working_dir: /app
    environment:
      LARAVEL_URL: http://backend:8000
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "8080"]

volumes:
  internmatch_mysql:
  backend_vendor:
  frontend_node_modules:
