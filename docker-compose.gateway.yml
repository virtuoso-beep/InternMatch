# Optional local integration gateway. This is not a production/TLS configuration.
services:
  backend:
    environment:
      FRONTEND_URL: http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081
      SANCTUM_STATEFUL_DOMAINS: localhost:8080,127.0.0.1:8080,localhost:8081,127.0.0.1:8081
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8081:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
