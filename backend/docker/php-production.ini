; Production (docker-compose.production.yml, Dockerfile target "production"), on top of php.ini-production.
expose_php=Off
opcache.enable=1
opcache.memory_consumption=192
opcache.max_accelerated_files=20000
; Code is bind-mounted and updated with git pull; recheck file timestamps every 2 seconds so a deployment
; takes effect without relying on a container restart.
opcache.validate_timestamps=1
opcache.revalidate_freq=2
