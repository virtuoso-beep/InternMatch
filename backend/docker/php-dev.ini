; Local development only (docker-compose.yml). php artisan serve runs the CLI server, where opcache is off by default.
; Timestamps are rechecked at most every 2 seconds, so code edits take effect almost immediately.
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.memory_consumption=192
opcache.max_accelerated_files=20000
